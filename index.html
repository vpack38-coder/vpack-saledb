<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>รายงานยอดขาย - V-pack</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<style>
  :root{--navy:#1f3a5f;--navy2:#2c5282;--line:#d5dbe3;--soft:#f3f6fa;--txt:#1e2733;--mute:#6b7685;--ok:#1e7f4f;--warn:#b54708;--bar:#3b6ea8;--red:#b42318}
  *{box-sizing:border-box}
  body{margin:0;font-family:Tahoma,sans-serif;font-size:13px;color:var(--txt);background:#e9edf2;line-height:1.35}
  .wrap{max-width:1180px;margin:0 auto;padding:12px}
  .topbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--navy);color:#fff;padding:8px 12px;border-radius:6px}
  .topbar h1{font-size:15px;margin:0}
  .topbar .upd{font-size:11px;opacity:.8}
  .topbar .sp{flex:1}
  .btn{font-family:Tahoma;font-size:12px;border:1px solid transparent;border-radius:4px;padding:5px 10px;cursor:pointer;background:#fff;color:var(--navy)}
  .btn:hover{filter:brightness(.95)}
  .btn.green{background:#1e7f4f;color:#fff}
  .btn.orange{background:#c2410c;color:#fff}
  .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
  .btn.line{background:#fff;border-color:#b9c3cf}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  /* login */
  .login{max-width:340px;margin:60px auto;background:#fff;border-radius:8px;padding:24px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.08)}
  .login h2{margin:0 0 4px;color:var(--navy);font-size:18px}
  .login p{margin:0 0 14px;color:var(--mute);font-size:12px}
  .login input[type=password]{width:100%;font-family:Tahoma;font-size:24px;letter-spacing:8px;text-align:center;padding:8px;border:1px solid #b9c3cf;border-radius:6px}
  .login .btn{width:100%;margin-top:10px;padding:9px;font-size:15px;background:var(--navy);color:#fff}
  .login label{display:block;margin-top:10px;font-size:12px;color:var(--mute)}
  .login .err{color:var(--red);margin-top:8px;min-height:16px;font-size:12px}
  /* filter */
  .filter{margin-top:10px;background:#fff;border-radius:6px;padding:8px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12px}
  .filter select,.filter input{font-family:Tahoma;font-size:12px;padding:3px 4px;border:1px solid #b9c3cf;border-radius:3px}
  .filter input.d{width:92px;text-align:center}
  .filter .lbl{color:var(--mute)}
  .filter input.d.bad{border-color:var(--red);background:#fdecea}
  .filter .grp{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .filter .sep{width:1px;height:20px;background:var(--line)}
  .quick button{font-family:Tahoma;font-size:11px;border:1px solid #b9c3cf;background:var(--soft);border-radius:3px;padding:2px 6px;cursor:pointer}
  .quick button:hover{background:#e2eaf4}
  .paper{background:#fff;margin-top:10px;border-radius:6px;padding:14px 16px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .rhead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;border-bottom:2px solid var(--navy);padding-bottom:6px}
  .rhead .co{font-size:14px;font-weight:bold;color:var(--navy)}
  .rhead .tt{font-size:16px;font-weight:bold;margin-top:2px}
  .rhead .meta{text-align:right;color:var(--mute);font-size:12px}
  .rhead .period{font-size:13px;color:var(--txt);font-weight:bold}
  .note{display:inline-block;margin-top:3px;background:#fff4e5;color:var(--warn);border:1px solid #f5c58a;border-radius:3px;padding:1px 6px;font-size:11px}
  .kpis{display:flex;flex-wrap:wrap;margin:10px 0;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--line);gap:1px}
  .kpi{flex:1 1 150px;padding:6px 10px;background:var(--soft);min-width:0}
  .kpi .l{font-size:11px;color:var(--mute)}
  .kpi .v{font-size:15px;font-weight:bold;color:var(--navy)}
  .kpi .v.big{color:#0f5132}
  .kpi .s{font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .up{color:#1e7f4f!important}.down{color:var(--red)!important}
  .tools{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12px;color:var(--mute)}
  .tools select{font-family:Tahoma;font-size:12px;padding:2px 4px}
  .tools .sp{flex:1}
  table{width:100%;border-collapse:collapse}
  th{background:var(--navy);color:#fff;font-weight:normal;font-size:12px;padding:4px 6px;border:1px solid #16304f;white-space:nowrap}
  td{padding:2px 6px;border:1px solid var(--line);white-space:nowrap}
  tbody tr:nth-child(even) td{background:#f8fafc}
  tbody tr:hover td{background:#eaf2fb}
  td.n{text-align:right;font-variant-numeric:tabular-nums}
  td.c{text-align:center}
  td.name{white-space:normal;min-width:220px}
  td.code{color:var(--mute);font-size:12px}
  tfoot td{font-weight:bold;background:#e3eaf3;border-top:2px solid var(--navy)}
  .share{display:flex;align-items:center;gap:5px;justify-content:flex-end}
  .share .bar{height:8px;background:var(--bar);border-radius:2px}
  .share span{min-width:42px;text-align:right}
  .muted{color:#aab3bf}
  .empty{padding:20px;text-align:center;color:var(--mute)}
  .check{margin-top:8px;font-size:12px;color:var(--mute)}
  .foot{margin-top:10px;display:flex;justify-content:space-between;color:var(--mute);font-size:11px}
  .hidden{display:none!important}
  .loading{text-align:center;padding:40px;color:var(--mute)}
  /* modal (admin) */
  .modal-bg{position:fixed;inset:0;background:rgba(15,25,40,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:10px}
  .modal{background:#fff;border-radius:8px;max-width:520px;width:100%;padding:16px 18px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
  .modal h3{margin:0 0 8px;color:var(--navy);font-size:15px}
  .modal table td{padding:4px 8px}
  .modal .warn{margin-top:8px;padding:6px 8px;border-radius:4px;background:#fdecea;color:var(--red);font-size:12px}
  .modal .info{margin-top:8px;font-size:12px;color:var(--mute)}
  .modal .act{margin-top:12px;display:flex;justify-content:flex-end;gap:8px}

  /* แท็บ */
  .tabs{display:flex;gap:4px;margin-top:10px}
  .tabs button{font-family:Tahoma;font-size:13px;border:1px solid #c5ceda;border-bottom:none;background:#dfe5ec;color:var(--navy);padding:6px 14px;border-radius:6px 6px 0 0;cursor:pointer}
  .tabs button.on{background:#fff;font-weight:bold}
  .tabs + .filter{margin-top:0;border-top-left-radius:0}
  .filter input.cust{width:240px;font-family:Tahoma;font-size:12px;padding:3px 4px;border:1px solid #b9c3cf;border-radius:3px}
  .filter input.ccode{width:150px}
  .filter .brk{flex-basis:100%;height:0}
  /* เปรียบเทียบรายเดือน */
  #tblCmp td.n{min-width:78px}
  #tblCmp td.name{white-space:nowrap;max-width:230px;min-width:140px;overflow:hidden;text-overflow:ellipsis}
  #tblCmp th.mo{min-width:78px}
  .spark{display:block}
  body.wide .wrap{max-width:1800px}
  td.tot{background:#eef3f9!important;font-weight:bold}
  /* dashboard */
  .dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .dcard{border:1px solid var(--line);border-radius:4px;padding:8px 10px;background:#fff;min-width:0}
  .dcard.full{grid-column:1 / -1}
  .dcard h4{margin:0 0 6px;font-size:13px;color:var(--navy)}
  .dcard .sub{font-weight:normal;color:var(--mute);font-size:11px}
  .legend{display:flex;gap:14px;font-size:11px;color:var(--mute);margin-bottom:2px}
  .legend i{display:inline-block;width:12px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle}
  .legend i.ln{height:2px;border-radius:0}
  svg .ax{fill:#6b7685;font-size:10px;font-family:Tahoma}
  svg .grid{stroke:#e5e9ef;stroke-width:1}
  svg .hit{fill:transparent;cursor:default}
  svg .hit:hover{fill:rgba(31,58,95,.07)}
  .hb{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;align-items:center;gap:6px;padding:2px 0;font-size:12px}
  .hb .hn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hb .hbar{height:10px;background:#eef1f5;border-radius:2px;overflow:hidden}
  .hb .hbar i{display:block;height:100%;background:#2a78d6;border-radius:0 4px 4px 0}
  .hb .hv{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;color:#33404f}
  .hb.other .hbar i{background:#9aa5b4}
  .mtab{width:100%;margin-top:6px;font-size:12px}
  .mtab td,.mtab th{padding:2px 6px}
  #tip{position:fixed;z-index:60;background:#1e2733;color:#fff;font-size:12px;padding:6px 8px;border-radius:4px;pointer-events:none;line-height:1.5;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.2)}
  #tip .sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
  @media (max-width:720px){ .dgrid{grid-template-columns:1fr} .filter input.cust{width:100%} .tabs button{flex:1;padding:6px 4px;font-size:12px} }
  @media print{ .tabs{display:none!important} .dcard{break-inside:avoid} }

  /* แถบตั้งค่าการพิมพ์ */
  .printbar{margin-top:10px;background:#fffbea;border:1px solid #f0d68a;border-radius:6px;padding:8px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:12px}
  .printbar select{font-family:Tahoma;font-size:12px;padding:3px 4px;border:1px solid #b9c3cf;border-radius:3px}
  .printbar .lbl{color:var(--mute)}
  .printbar .hint{color:var(--warn);font-size:11px}
  .printbar .sp{flex:1}
  /* รายงานตามฟอนต์/ขนาดที่เลือก (ตอนดูตัวอย่าง + ตอนพิมพ์) */
  .paper.pp{font-family:var(--pf);font-size:var(--ps);line-height:1.3}
  .paper.pp *{font-family:inherit}
  .paper.pp .rhead .co{font-size:1.1em}
  .paper.pp .rhead .tt{font-size:1.25em}
  .paper.pp .rhead .meta{font-size:.92em}
  .paper.pp .rhead .period{font-size:1.08em}
  .paper.pp .note,.paper.pp .kpi .l,.paper.pp .kpi .s,.paper.pp .foot{font-size:.85em}
  .paper.pp .kpi .v{font-size:1.15em}
  .paper.pp .kpi .v.vn{font-size:1em!important}
  .paper.pp th,.paper.pp td.code,.paper.pp .check{font-size:.92em}
  .paper.pp td,.paper.pp td.name{font-size:1em}

  /* ---------- มือถือ ---------- */
  @media (max-width:720px){
    body{font-size:14px}
    .wrap{padding:6px}
    .topbar h1{font-size:14px}
    .topbar .upd{width:100%;order:9}
    .filter{font-size:13px}
    .filter .sep{display:none}
    .filter select,.filter input{font-size:14px;padding:5px}
    .filter input.d{width:110px}
    .quick button{font-size:13px;padding:5px 8px}
    .paper{padding:10px}
    .rhead{flex-direction:column;align-items:flex-start}
    .rhead .meta{text-align:left}
    .kpi{flex:1 1 45%}
    .kpi .v{font-size:16px}
    .hm{display:none}
    td.name{min-width:0;font-size:13px}
    td,th{padding:4px}
    .share .bar{display:none}
    .btn.hm-btn{display:none}
  }
  @media print{
    body{background:#fff}.wrap{max-width:none;padding:0}
    .topbar,.filter,.tools,.printbar,.noprint{display:none!important}
    .paper{box-shadow:none;margin:0;padding:0}
    th,.share .bar,.kpi,tfoot td,.note{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
<style id="pageStyle">@page{size:A4 landscape;margin:10mm}</style>
</head>
<body>
<div class="wrap">

  <!-- ===== หน้าใส่รหัส ===== -->
  <div class="login" id="loginBox">
    <h2>📊 รายงานยอดขาย V-pack</h2>
    <p>กรุณาใส่รหัส PIN เพื่อดูรายงาน</p>
    <input type="password" id="pin" inputmode="numeric" maxlength="12" autocomplete="off" onkeydown="if(event.key==='Enter')login()">
    <label><input type="checkbox" id="remember" checked> จำรหัสไว้ในเครื่องนี้</label>
    <button class="btn" id="btnLogin" onclick="login()">เข้าดูรายงาน</button>
    <div class="err" id="loginErr"></div>
  </div>

  <!-- ===== หน้ารายงาน ===== -->
  <div id="app" class="hidden">
    <div class="topbar">
      <h1>📊 รายงานยอดขายประจำงวด</h1>
      <span class="upd" id="updInfo"></span>
      <span class="sp"></span>
      <button class="btn orange hidden" id="btnUpload" onclick="$('file').click()">⬆ อัปเดตข้อมูล</button>
      <button class="btn hm-btn" onclick="togglePrint()">🖨 พิมพ์</button>
      <button class="btn green" onclick="exportExcel()">⬇ Excel</button>
      <button class="btn ghost" onclick="logout()">ออก</button>
    </div>
    <div class="printbar hidden" id="printbar">
      <b>🖨 ตั้งค่าการพิมพ์</b>
      <span class="lbl">ฟอนต์</span>
      <select id="pFont" onchange="onFont()">
        <option value="Tahoma">Tahoma</option>
        <option value="Sarabun">Sarabun (สารบรรณ)</option>
        <option value="TH Sarabun New">TH Sarabun New</option>
        <option value="Angsana New">Angsana New</option>
        <option value="Cordia New">Cordia New</option>
        <option value="Browallia New">Browallia New</option>
        <option value="Leelawadee UI">Leelawadee UI</option>
        <option value="Arial">Arial</option>
      </select>
      <span class="lbl">ขนาด</span>
      <select id="pSize" onchange="applyPrint()">
        <option>8</option><option>9</option><option>10</option><option>11</option><option>12</option>
        <option>13</option><option>14</option><option>15</option><option>16</option><option>18</option><option>20</option>
      </select><span class="lbl">pt</span>
      <span class="lbl">กระดาษ</span>
      <select id="pPage" onchange="applyPrint()">
        <option value="A4 landscape">A4 แนวนอน</option>
        <option value="A4 portrait">A4 แนวตั้ง</option>
      </select>
      <span class="hint" id="pHint"></span>
      <span class="sp"></span>
      <button class="btn green" onclick="window.print()">🖨 สั่งพิมพ์</button>
      <button class="btn line" onclick="togglePrint(false)">ปิด</button>
    </div>
    <input type="file" id="file" accept=".csv,.CSV" class="hidden">

    <div class="tabs">
      <button id="tab-sum" class="on" onclick="setTab('sum')">📋 สรุปยอดขาย</button>
      <button id="tab-cmp" onclick="setTab('cmp')">📅 เปรียบเทียบรายเดือน</button>
      <button id="tab-dash" onclick="setTab('dash')">📈 Dashboard</button>
    </div>
    <div class="filter">
      <span class="grp fSum">
      <div class="grp"><span class="lbl">ช่วงรายงาน</span>
        <select id="mode" onchange="onMode()">
          <option value="month">รายเดือน</option>
          <option value="mrange">ช่วงเดือน</option>
          <option value="drange">ช่วงวันที่</option>
          <option value="year">ทั้งปี</option>
          <option value="all">ทั้งหมด</option>
        </select>
      </div>
      <div class="grp" id="gMonth"><select id="m1" onchange="render()"></select><span id="mTo" class="lbl">ถึง</span><select id="m2" onchange="render()"></select></div>
      <div class="grp" id="gDate"><input class="d" id="d1" placeholder="วว/ดด/ปปปป" inputmode="numeric" maxlength="10" autocomplete="off"><span class="lbl">ถึง</span><input class="d" id="d2" placeholder="วว/ดด/ปปปป" inputmode="numeric" maxlength="10" autocomplete="off"></div>
      <div class="grp" id="gYear"><select id="y1" onchange="render()"></select></div>
      </span>
      <div class="grp fCmp hidden"><span class="lbl">ถึงเดือน</span><select id="cmpEnd" onchange="render()"></select>
        <span class="lbl">ย้อนหลัง</span>
        <select id="cmpN" onchange="render()"><option value="3">3 เดือน</option><option value="6">6 เดือน</option><option value="12" selected>12 เดือน</option><option value="24">24 เดือน</option></select>
      </div>
      <div class="sep fGrp"></div>
      <div class="grp fGrp"><span class="lbl">แสดงตาม</span>
        <select id="groupBy" onchange="$('sortSel').value = this.value==='month' ? 'key' : 'net'; render()">
          <option value="cust">ลูกค้า</option>
          <option value="month" id="optGbMonth">เดือน</option>
          <option value="emp">พนักงานขาย</option>
        </select>
      </div>
      <div class="sep fSum"></div>
      <div class="grp quick fSum">
        <button onclick="quick('thisM')">เดือนนี้</button>
        <button onclick="quick('lastM')">เดือนที่แล้ว</button>
        <button onclick="quick('ytd')">ต้นปีถึงวันนี้</button>
        <button onclick="quick('lastY')">ปีที่แล้ว</button>
      </div>
      <div class="brk"></div>
      <div class="grp"><span class="lbl">ลูกค้า</span>
        <select id="cMode" onchange="onCustMode()">
          <option value="all">ทั้งหมด</option>
          <option value="one">เลือก / ค้นหาลูกค้า</option>
          <option value="range">ช่วงรหัสลูกค้า</option>
        </select>
        <input class="cust hidden" id="cOne" list="custList" placeholder="พิมพ์รหัสหรือชื่อลูกค้า แล้วเลือกจากรายการ" autocomplete="off">
        <input class="cust ccode hidden" id="cA" list="custList" placeholder="ตั้งแต่รหัส" autocomplete="off">
        <span class="lbl hidden" id="cTo">ถึง</span>
        <input class="cust ccode hidden" id="cB" list="custList" placeholder="ถึงรหัส" autocomplete="off">
        <datalist id="custList"></datalist>
      </div>
    </div>

    <div class="paper" id="report">
      <div class="rhead">
        <div>
          <div class="co" id="rCo"></div>
          <div class="tt" id="rTitle"></div>
          <span class="note">* ยอดขายสุทธิก่อน VAT รวมใบลด/เพิ่มหนี้แล้ว (ไม่รวมใบที่ยกเลิก)</span>
        </div>
        <div class="meta"><div class="period" id="rPeriod"></div><div id="rDays"></div></div>
      </div>
      <div class="kpis" id="kpis"></div>
      <div class="tools" id="toolsBar">
        <span>เรียงตาม</span>
        <select id="sortSel" onchange="render()">
          <option value="net">ยอดขายมาก → น้อย</option>
          <option value="key">รหัส / ลำดับเวลา</option>
          <option value="name">ชื่อ ก-ฮ</option>
        </select>
      </div>
      <div id="secSum" style="overflow-x:auto"><table><thead id="thead"></thead><tbody id="tbody"></tbody><tfoot id="tfoot"></tfoot></table></div>
      <div id="secCmp" class="hidden" style="overflow-x:auto"><table id="tblCmp"><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
      <div id="secDash" class="hidden"></div>
      <div class="check noprint" id="check"></div>
      <div class="foot"><span id="printedAt"></span><span>V-pack · รายงานยอดขายประจำงวด</span></div>
    </div>
  </div>

  <div class="loading hidden" id="loading">⏳ กำลังโหลดข้อมูล...</div>
</div>

<!-- หน้าต่างยืนยันอัปเดตข้อมูล (แอดมิน) -->
<div id="tip" class="hidden"></div>
<div class="modal-bg hidden" id="modalBg"><div class="modal" id="modal"></div></div>

<script>
// ===== ตั้งค่า: วาง URL ของ Apps Script Web app ตรงนี้ =====
const API_URL = 'https://script.google.com/macros/s/AKfycbzt_rllU5Z1QTyLYUfsav87ZMUpjo4qq8VJlV3ZzjvC-WAwVXM9U917kMB45jHHIGFx7g/exec';
// ==========================================================

const TH_M = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TH_MF = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const PIN_KEY = 'vpack_sales_pin';
let PIN = '', ROLE = '', DATA = null, VIEW = null, PENDING = null;

// ---------- helpers ----------
const fmt  = n => (Math.abs(n)<0.005 ? '-' : n.toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2}));
const fmt0 = n => n.toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = x => String(x).padStart(2,'0');
const $ = id => document.getElementById(id);
const isoToBE = iso => iso ? `${iso.slice(8,10)}/${iso.slice(5,7)}/${+iso.slice(0,4)+543}` : '';
function beToISO(s){
  const m = String(s).trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/); if(!m) return null;
  let y = +m[3]; if (y<100) y += 2500; if (y>2400) y -= 543;
  return `${y}-${pad(m[2])}-${pad(m[1])}`;
}
const ymLabel = ym => `${TH_M[+ym.slice(5,7)-1]} ${+ym.slice(0,4)+543}`;
const ymLabelF = ym => `${TH_MF[+ym.slice(5,7)-1]} ${+ym.slice(0,4)+543}`;
const lastDay = ym => { const [y,m]=ym.split('-').map(Number); return `${ym}-${pad(new Date(y,m,0).getDate())}`; };
const daysBetween = (a,b) => Math.round((new Date(b)-new Date(a))/86400000)+1;
function shiftYear(iso,dy){ const y=+iso.slice(0,4)+dy; let s=`${y}${iso.slice(4)}`; if(s.slice(5)==='02-29' && !(y%4===0&&(y%100!==0||y%400===0))) s=`${y}-02-28`; return s; }
function nowBE(){ const d=new Date(); return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()+543} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
const shortName = n => String(n).replace(/\s*\(สำนักงานใหญ่\).*$/,'').replace(/\s*จำกัด\s*$/,'').trim();
const lsGet = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
const lsSet = (k,v) => { try { v===null ? localStorage.removeItem(k) : localStorage.setItem(k,v); } catch(e){} };

async function api(body){
  if (API_URL.startsWith('PASTE')) throw new Error('ยังไม่ได้ใส่ API_URL ในไฟล์ index.html');
  const res = await fetch(API_URL, {method:'POST', body: JSON.stringify(body)});   // text/plain: ไม่ติด CORS
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'เกิดข้อผิดพลาด');
  return j;
}

// ใบส่งของ = SI01/... (หรือเลขล้วนจากไฟล์รุ่นเก่า) · อย่างอื่น (SM01/... ฯลฯ) = ใบลด/เพิ่มหนี้
const isSale = no => /^(SI|\d)/i.test(String(no));
const docType = no => isSale(no) ? 'ใบส่งของ' : 'ลด/เพิ่มหนี้';

// ---------- login / load ----------
async function login(saved){
  const p = saved || $('pin').value.trim();
  if (!p){ $('loginErr').textContent='กรุณาใส่รหัส'; return; }
  $('loginErr').textContent=''; $('btnLogin').disabled=true;
  $('loginBox').classList.add('hidden'); $('loading').classList.remove('hidden');
  try{
    const j = await api({action:'data', pin:p});
    PIN = p; ROLE = j.role;
    if (saved || $('remember').checked) lsSet(PIN_KEY, p);
    applyData(j);
    $('app').classList.remove('hidden');
  }catch(err){
    $('loginBox').classList.remove('hidden');
    $('loginErr').textContent = err.message;
    if (saved) lsSet(PIN_KEY, null);
  }finally{ $('loading').classList.add('hidden'); $('btnLogin').disabled=false; }
}
function logout(){ lsSet(PIN_KEY, null); location.reload(); }

function applyData(j){
  const docs = j.rows.map(r=>({d:r[0], no:r[1], code:r[2], name:j.cust[r[2]]||r[2], emp:r[3], empn:j.emp[r[3]]||r[3],
                               amt:r[4], vat:r[5], tot:r[6], due:r[7], po:r[8], sale: isSale(r[1])}));
  DATA = {company:j.meta.company, updatedAt:j.meta.updatedAt, docs,
          minD: docs.length?docs[0].d:'', maxD: docs.length?docs[docs.length-1].d:''};
  $('updInfo').textContent = j.meta.updatedAt ? `ข้อมูลล่าสุดถึง ${isoToBE(DATA.maxD)} · อัปเดตเมื่อ ${j.meta.updatedAt}` : '';
  $('btnUpload').classList.toggle('hidden', ROLE!=='admin');
  if (!docs.length){
    $('report').innerHTML = `<div class="empty">ยังไม่มีข้อมูลในฐานข้อมูล ${ROLE==='admin'?'— กดปุ่ม “⬆ อัปเดตข้อมูล” แล้วเลือกไฟล์ PCRSX1.CSV':''}</div>`;
    return;
  }
  setupFilter();
  render();
}

// ---------- filter ----------
function setupFilter(){
  const keep = $('m1').value;
  const months = [...new Set(DATA.docs.map(d=>d.d.slice(0,7)))].sort().reverse();
  const years = [...new Set(months.map(m=>m.slice(0,4)))];
  const opt = months.map(m=>`<option value="${m}">${ymLabel(m)}</option>`).join('');
  $('m1').innerHTML = opt; $('m2').innerHTML = opt;
  $('y1').innerHTML = years.map(y=>`<option value="${y}">ปี ${+y+543}</option>`).join('');
  $('m1').value = months.includes(keep) ? keep : months[0]; $('m2').value = $('m1').value; $('y1').value = years[0];
  if (!$('d1').value){ $('d1').value = isoToBE(months[0]+'-01'); $('d2').value = isoToBE(DATA.maxD); }
  const keepE = $('cmpEnd').value; $('cmpEnd').innerHTML = opt; $('cmpEnd').value = months.includes(keepE) ? keepE : months[0];
  setupCustList();
  onMode(true);
}
function onMode(silent){
  const m = $('mode').value;
  $('gMonth').classList.toggle('hidden', !(m==='month'||m==='mrange'));
  $('m2').classList.toggle('hidden', m!=='mrange'); $('mTo').classList.toggle('hidden', m!=='mrange');
  $('gDate').classList.toggle('hidden', m!=='drange');
  $('gYear').classList.toggle('hidden', m!=='year');
  if (m==='mrange' && $('m2').value < $('m1').value) $('m2').value = $('m1').value;
  if (!silent) render();
}
function getRange(){
  const m = $('mode').value;
  if (m==='month'){ const a=$('m1').value; return {from:a+'-01', to:lastDay(a), label:'ประจำเดือน '+ymLabelF(a)}; }
  if (m==='mrange'){ let a=$('m1').value, b=$('m2').value; if (b<a) [a,b]=[b,a];
    return {from:a+'-01', to:lastDay(b), label: a===b ? 'ประจำเดือน '+ymLabelF(a) : `เดือน ${ymLabel(a)} – ${ymLabel(b)}`}; }
  if (m==='year'){ const y=$('y1').value; return {from:`${y}-01-01`, to:`${y}-12-31`, label:`ประจำปี ${+y+543}`}; }
  if (m==='all') return {from:DATA.minD, to:DATA.maxD, label:''};
  let a = beToISO($('d1').value), b = beToISO($('d2').value);
  if (!a || !b) return null;
  if (b<a) [a,b]=[b,a];
  return {from:a, to:b, label:''};
}
function quick(k){
  const t = new Date(), y=t.getFullYear(), mo=t.getMonth()+1;
  const today = `${y}-${pad(mo)}-${pad(t.getDate())}`;
  let a,b;
  if (k==='thisM'){ a=`${y}-${pad(mo)}-01`; b=today; }
  if (k==='lastM'){ const d=new Date(y,mo-2,1); const ym=`${d.getFullYear()}-${pad(d.getMonth()+1)}`; a=ym+'-01'; b=lastDay(ym); }
  if (k==='ytd'){ a=`${y}-01-01`; b=today; }
  if (k==='lastY'){ a=`${y-1}-01-01`; b=`${y-1}-12-31`; }
  $('mode').value='drange'; $('d1').value=isoToBE(a); $('d2').value=isoToBE(b); onMode();
}

// ---------- ตัวกรองลูกค้า ----------
function setupCustList(){
  const m = new Map(); DATA.docs.forEach(d=>m.set(d.code, d.name));
  DATA.custs = [...m.entries()].sort((a,b)=>a[0]<b[0]?-1:1);
  $('custList').innerHTML = DATA.custs.map(([c,n])=>`<option value="${esc(c)} — ${esc(n)}">`).join('');
}
function onCustMode(){
  const m = $('cMode').value;
  $('cOne').classList.toggle('hidden', m!=='one');
  ['cA','cB','cTo'].forEach(id=>$(id).classList.toggle('hidden', m!=='range'));
  if (m==='one') $('cOne').focus(); if (m==='range') $('cA').focus();
  render();
}
const codeOf = v => String(v||'').split(' — ')[0].trim();
function getCust(){
  const m = $('cMode').value;
  if (m==='one'){
    const v = codeOf($('cOne').value); if (!v) return {mode:'all', label:''};
    const hit = DATA.custs.find(([c])=>c===v);
    if (hit) return {mode:'one', code:v, label:`ลูกค้า: ${v} ${hit[1]}`};
    const q = v.toLowerCase();
    return {mode:'search', q, label:`ลูกค้าที่มีคำว่า “${v}”`};
  }
  if (m==='range'){
    const a = codeOf($('cA').value), b = codeOf($('cB').value);
    if (!a && !b) return {mode:'all', label:''};
    return {mode:'range', a, b, label:`รหัสลูกค้า ${a||'(แรก)'} ถึง ${b||'(สุดท้าย)'}`};
  }
  return {mode:'all', label:''};
}
function applyCust(docs){
  const c = getCust();
  if (c.mode==='one') return docs.filter(d=>d.code===c.code);
  if (c.mode==='search') return docs.filter(d=>d.code.toLowerCase().includes(c.q) || d.name.toLowerCase().includes(c.q));
  if (c.mode==='range') return docs.filter(d=>(!c.a || d.code>=c.a) && (!c.b || d.code<=c.b));
  return docs;
}
['cOne','cA','cB'].forEach(id=>{
  const el = $(id);
  el.addEventListener('change', ()=>render());
  el.addEventListener('input', ()=>{ if (el.value.includes(' — ') || el.value==='') render(); });
  el.addEventListener('keydown', e=>{ if (e.key==='Enter') render(); });
});

// ---------- build view ----------
function buildView(){
  const R = getRange();
  if (!R) return {error:'กรอกวันที่ให้ครบในรูปแบบ วว/ดด/ปปปป (พ.ศ.) เช่น 01/11/2569'};
  const CD = applyCust(DATA.docs), cust = getCust();
  const docs = CD.filter(d=>d.d>=R.from && d.d<=R.to);
  const gb = $('groupBy').value;
  const map = new Map();
  docs.forEach(d=>{
    let k, name;
    if (gb==='cust'){ k=d.code; name=d.name; }
    else if (gb==='emp'){ k=d.emp||'-'; name=d.empn||'-'; }
    else { k=d.d.slice(0,7); name=ymLabelF(k); }
    let g = map.get(k);
    if (!g){ g={key:k,name,net:0,vat:0,gross:0,bills:0,sale:0,adj:0,custs:new Set(),credit:0,lastD:''}; map.set(k,g); }
    g.net+=d.amt; g.vat+=d.vat; g.gross+=d.tot; g.custs.add(d.code);
    if (d.sale){ g.sale+=d.amt; g.bills++; } else g.adj+=d.amt;
    if (gb==='cust' && d.sale && d.d>=g.lastD){ g.lastD=d.d; g.credit = d.due ? Math.max(0,daysBetween(d.d,d.due)-1) : 0; }
  });
  const rows = [...map.values()].map(g=>({...g, net:r2(g.net), vat:r2(g.vat), gross:r2(g.gross), sale:r2(g.sale), adj:r2(g.adj), ncust:g.custs.size}));
  // m:false = ซ่อนบนมือถือ
  let cols;
  if (gb==='cust') cols = [
    {h:'รหัสลูกค้า',k:'key',t:'code',w:18,m:false},{h:'ชื่อลูกค้า',k:'name',t:'name',w:50},{h:'เครดิต (วัน)',k:'credit',t:'int',w:10,nosum:true,m:false},{h:'จำนวนบิล',k:'bills',t:'int',w:9,m:false}];
  else if (gb==='emp') cols = [
    {h:'รหัสพนักงาน',k:'key',t:'code',w:14,m:false},{h:'ชื่อพนักงานขาย',k:'name',t:'name',w:34},{h:'จำนวนลูกค้า',k:'ncust',t:'int',w:11,nosum:true,m:false},{h:'จำนวนบิล',k:'bills',t:'int',w:9,m:false}];
  else cols = [
    {h:'เดือน',k:'name',t:'name',w:20},{h:'จำนวนลูกค้า',k:'ncust',t:'int',w:11,nosum:true,m:false},{h:'จำนวนบิล',k:'bills',t:'int',w:9,m:false}];
  cols = cols.concat([{h:'ยอดขาย',k:'sale',t:'num',w:16,m:false},{h:'ลด/เพิ่มหนี้',k:'adj',t:'num',w:13,m:false},{h:'ยอดขายสุทธิ (ก่อน VAT)',k:'net',t:'numB',w:18},{h:'VAT 7%',k:'vat',t:'num',w:14,m:false},{h:'รวม VAT',k:'gross',t:'num',w:16,m:false}]);

  let prev = null;
  const effTo = R.to > DATA.maxD ? DATA.maxD : R.to;
  const pf = shiftYear(R.from,-1), pt = shiftYear(effTo,-1);
  if (pf >= DATA.minD.slice(0,7)+'-01' && effTo >= R.from) prev = {amt:r2(CD.filter(d=>d.d>=pf && d.d<=pt).reduce((s,d)=>s+d.amt,0)), from:pf, to:pt};

  const tot = {sale:r2(docs.filter(d=>d.sale).reduce((s,d)=>s+d.amt,0)), adj:r2(docs.filter(d=>!d.sale).reduce((s,d)=>s+d.amt,0)), bills:docs.filter(d=>d.sale).length, net:r2(docs.reduce((s,d)=>s+d.amt,0)), vat:r2(docs.reduce((s,d)=>s+d.vat,0)), gross:r2(docs.reduce((s,d)=>s+d.tot,0))};
  const groupName = {cust:'ลูกค้า',emp:'พนักงานขาย',month:'เดือน'}[gb];
  return {kind:'sum', gb, R, docs, rows, cols, tot, prev, ncust:new Set(docs.map(d=>d.code)).size,
    title:`รายงานสรุปยอดขายตาม${groupName} (ประจำงวด)`,
    period:`${R.label?R.label+' · ':''}วันที่ ${isoToBE(R.from)} ถึง ${isoToBE(R.to)}${cust.label?' · '+cust.label:''}`,
    note:'หมายเหตุ: ยอดขายสุทธิก่อน VAT = ใบส่งของ + ใบลด/เพิ่มหนี้ (ไม่รวมใบที่ยกเลิก) · VAT ตามที่ออกในเอกสาร'};
}
function sortRows(v){
  const s = $('sortSel').value, rows = v.rows;
  if (s==='net') rows.sort((a,b)=>b.net-a.net);
  else if (s==='name') rows.sort((a,b)=>String(a.name).localeCompare(String(b.name),'th'));
  else rows.sort((a,b)=> a.key<b.key?-1:1);
}

// ---------- render ----------
function render(){
  if (!DATA || !DATA.docs.length) return;
  hideTip();
  $('secSum').classList.toggle('hidden', TAB!=='sum');
  $('secCmp').classList.toggle('hidden', TAB!=='cmp');
  $('secDash').classList.toggle('hidden', TAB!=='dash');
  $('toolsBar').classList.toggle('hidden', TAB==='dash');
  $('rCo').textContent = DATA.company || 'บริษัท วี แพค การพิมพ์และบรรจุภัณฑ์ จำกัด';
  $('check').textContent = `ข้อมูลในฐานข้อมูล: ${isoToBE(DATA.minD)} ถึง ${isoToBE(DATA.maxD)} · ${DATA.docs.length.toLocaleString()} เอกสาร`;
  $('printedAt').textContent = 'พิมพ์เมื่อ ' + nowBE();
  if (TAB==='cmp') return renderCompare();
  if (TAB==='dash') return renderDash();
  renderSummary();
}
function renderSummary(){
  VIEW = buildView();
  const v = VIEW;
  $('rCo').textContent = DATA.company || 'บริษัท วี แพค การพิมพ์และบรรจุภัณฑ์ จำกัด';
  if (v.error){ $('tbody').innerHTML=`<tr><td class="empty">${v.error}</td></tr>`; $('thead').innerHTML=$('tfoot').innerHTML=$('kpis').innerHTML=''; return; }
  sortRows(v);
  $('rTitle').textContent = v.title;
  $('rPeriod').textContent = v.period;
  $('rDays').textContent = `รวม ${daysBetween(v.R.from,v.R.to)} วัน`;

  const t = v.tot, n = v.rows.length;
  const top = [...v.rows].sort((a,b)=>b.net-a.net)[0];
  let k = `<div class="kpi"><div class="l">ยอดขายสุทธิ (ก่อน VAT)</div><div class="v big">${fmt0(t.net)}</div><div class="s">${t.bills.toLocaleString()} บิล${t.adj?` · ลด/เพิ่มหนี้ ${fmt0(t.adj)}`:''}</div></div>
    <div class="kpi"><div class="l">ภาษีมูลค่าเพิ่ม 7%</div><div class="v">${fmt0(t.vat)}</div><div class="s">ตามที่ออกในใบกำกับ</div></div>
    <div class="kpi"><div class="l">ยอดรวม VAT</div><div class="v">${fmt0(t.gross)}</div><div class="s">&nbsp;</div></div>
    <div class="kpi"><div class="l">จำนวนลูกค้า</div><div class="v">${v.ncust.toLocaleString()} ราย</div><div class="s">เฉลี่ย ${v.ncust?fmt0(r2(t.net/v.ncust)):'-'} / ราย</div></div>`;
  if (v.prev){
    const p = v.prev.amt, diff = r2(t.net - p), pct = p ? diff/p*100 : 0;
    k += `<div class="kpi"><div class="l">เทียบช่วงเดียวกันปีก่อน</div><div class="v ${diff>=0?'up':'down'}">${diff>=0?'▲':'▼'} ${p?Math.abs(pct).toFixed(1)+'%':'-'}</div><div class="s">${isoToBE(v.prev.from).slice(0,5)}–${isoToBE(v.prev.to)} : ${fmt0(p)}</div></div>`;
  } else k += `<div class="kpi"><div class="l">เทียบช่วงเดียวกันปีก่อน</div><div class="v muted">-</div><div class="s">ไม่มีข้อมูลปีก่อน</div></div>`;
  if (top) k += `<div class="kpi"><div class="l">${v.gb==='month'?'เดือนยอดสูงสุด':v.gb==='emp'?'พนักงานยอดสูงสุด':'ลูกค้ายอดสูงสุด'}</div><div class="v vn" style="font-size:13px">${esc(shortName(top.name))}</div><div class="s">${fmt0(top.net)} (${t.net?(top.net/t.net*100).toFixed(1):0}%)</div></div>`;
  $('kpis').innerHTML = k;

  const cols = v.cols, hm = c => c.m===false ? ' hm' : '';
  $('thead').innerHTML = '<tr><th>ลำดับ</th>' + cols.map(c=>`<th class="${hm(c)}">${c.h.replace(' (ก่อน VAT)','<br>(ก่อน VAT)')}</th>`).join('') + '<th>สัดส่วน</th></tr>';
  if (!n){ $('tbody').innerHTML = `<tr><td colspan="${cols.length+2}" class="empty">ไม่มียอดขายในช่วงที่เลือก</td></tr>`; $('tfoot').innerHTML=''; }
  else {
    const maxNet = Math.max(...v.rows.map(r=>r.net), 1);
    $('tbody').innerHTML = v.rows.map((r,i)=>'<tr><td class="c">'+(i+1)+'</td>'+cols.map(c=>{
      const x = r[c.k], h = hm(c);
      if (c.t==='code') return `<td class="code${h}">${esc(x)}</td>`;
      if (c.t==='name') return `<td class="name${h}">${esc(x)}</td>`;
      if (c.t==='int') return `<td class="c${h}">${x? Number(x).toLocaleString() : '<span class="muted">-</span>'}</td>`;
      if (c.t==='numB') return `<td class="n${h}"><b>${fmt(x)}</b></td>`;
      return `<td class="n${h}">${fmt(x)}</td>`;
    }).join('')+`<td><div class="share"><div class="bar" style="width:${Math.max(2,r.net/maxNet*70)}px"></div><span>${t.net?(r.net/t.net*100).toFixed(1):'0.0'}%</span></div></td></tr>`).join('');
    // แถวรวม: ช่อง "รวมทั้งสิ้น" ครอบลำดับ + คอลัมน์ข้อความ
    const lead = cols.findIndex(c=>c.t!=='code'&&c.t!=='name');

    });

}

function ymAdd(ym,k){ let [y,m]=ym.split('-').map(Number); m+=k; while(m<1){m+=12;y--;} while(m>12){m-=12;y++;} return `${y}-${pad(m)}`; }
function monthsBack(end,n){ const out=[]; for(let i=n-1;i>=0;i--) out.push(ymAdd(end,-i)); return out; }
const ymShort = ym => `${TH_M[+ym.slice(5,7)-1]} ${String(+ym.slice(0,4)+543).slice(2)}`;
function buildCompare(){
  const end = $('cmpEnd').value, n = +$('cmpN').value, months = monthsBack(end,n);
  const from = months[0]+'-01', to = lastDay(end);
  const gb = $('groupBy').value==='emp' ? 'emp' : 'cust', cust = getCust();
  const docs = applyCust(DATA.docs).filter(d=>d.d>=from && d.d<=to);
  const idx = Object.fromEntries(months.map((m,i)=>[m,i]));
  const map = new Map();
  docs.forEach(d=>{
    const k = gb==='cust' ? d.code : (d.emp||'-');
    let g = map.get(k);
    if (!g){ g = {key:k, name: gb==='cust'?d.name:(d.empn||'-'), v:months.map(()=>0)}; map.set(k,g); }
    g.v[idx[d.d.slice(0,7)]] += d.amt;
    if (gb==='cust') g.name = d.name;
  });
  const rows = [...map.values()].map(g=>{
    g.v = g.v.map(r2); g.net = r2(g.v.reduce((a,b)=>a+b,0)); g.avg = r2(g.net/n); g.active = g.v.filter(x=>Math.abs(x)>0.005).length;
    const a = g.v[n-1], b = g.v[n-2]; g.chg = (n>1 && Math.abs(b)>0.005) ? (a-b)/Math.abs(b) : null;
    return g;
  });
  const colTot = months.map((m,i)=>r2(rows.reduce((s,r)=>s+r.v[i],0)));
  const total = r2(colTot.reduce((a,b)=>a+b,0));
  return {kind:'cmp', gb, months, from, to, rows, colTot, total, n, docs,
    title:`รายงานเปรียบเทียบยอดขายรายเดือน ตาม${gb==='cust'?'ลูกค้า':'พนักงานขาย'} (ย้อนหลัง ${n} เดือน)`,
    period:`เดือน ${ymLabel(months[0])} – ${ymLabel(end)}${cust.label?' · '+cust.label:''}`,
    note:'หมายเหตุ: ยอดขายสุทธิก่อน VAT (รวมใบลด/เพิ่มหนี้ ไม่รวมใบที่ยกเลิก)'};
}
function sparkSVG(vals){
  const w=80,h=18,mx=Math.max(...vals,0),mn=Math.min(...vals,0),rg=(mx-mn)||1;

  const last = pts.split(' ').pop().split(',');
  return `<svg class="spark" width="${w}" height="${h}"><polyline points="${pts}" fill="none" stroke="#2a78d6" stroke-width="1.5" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="2" fill="#2a78d6"/></svg>`;
}

  const T = $('tblCmp');

  const chg = c => c===null ? '<span class="muted">-</span>' : `<span class="${c>=0?'up':'down'}">${c>=0?'▲':'▼'} ${Math.abs(c*100).toFixed(1)}%</span>`;

// ================= Dashboard =================
const fmtI = n => Math.round(n).toLocaleString('th-TH');
function compactTH(v){ const a=Math.abs(v); if (a>=1e6) return (v/1e6).toFixed(a>=1e7?0:1).replace(/\.0$/,'')+' ล้าน'; if (a>=1e3) return Math.round(v/1e3)+'K'; return String(Math.round(v)); }
function niceStep(raw){ const p=Math.pow(10,Math.floor(Math.log10(raw||1))); const f=raw/p; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p; }
const tip = $('tip');
function showTip(e,html){ tip.innerHTML=html; tip.classList.remove('hidden'); const x=e.clientX+14, y=e.clientY+14; tip.style.left=Math.max(4,Math.min(x, innerWidth-tip.offsetWidth-8))+'px'; tip.style.top=Math.min(y, innerHeight-tip.offsetHeight-8)+'px'; }
function hideTip(){ tip && tip.classList.add('hidden'); }
function buildDash(){
  const end = $('cmpEnd').value, n = Math.max(+$('cmpN').value, 3), months = monthsBack(end,n), cust = getCust();
  const CD = applyCust(DATA.docs), byM = {};
  CD.forEach(d=>{ const m=d.d.slice(0,7); byM[m]=(byM[m]||0)+d.amt; });
  const firstM = DATA.minD.slice(0,7);
  const cur = months.map(m=>r2(byM[m]||0));
  const prev = months.map(m=>{ const p=ymAdd(m,-12); return p<firstM ? null : r2(byM[p]||0); });
  const from = months[0]+'-01', to = lastDay(end);
  const docs = CD.filter(d=>d.d>=from && d.d<=to);
  const agg = (keyF,nameF)=>{ const m=new Map(); docs.forEach(d=>{ const k=keyF(d); const g=m.get(k)||{key:k,name:nameF(d),net:0}; g.net+=d.amt; g.name=nameF(d); m.set(k,g); }); return [...m.values()].map(g=>({...g,net:r2(g.net)})).sort((a,b)=>b.net-a.net); };
  const custs = agg(d=>d.code, d=>d.name), emps = agg(d=>d.emp||'-', d=>d.empn||'-');
  const total = r2(cur.reduce((a,b)=>a+b,0));
  // ถ้าเดือนสุดท้ายยังไม่จบ (ข้อมูลถึงกลางเดือน) ให้เทียบถึง "วันเดียวกัน" ของเดือนก่อน/ปีก่อน
  const sumR = (a,b)=>r2(CD.filter(d=>d.d>=a && d.d<=b).reduce((s,d)=>s+d.amt,0));
  const partial = DATA.maxD < to && DATA.maxD >= end+'-01';
  const effEnd = partial ? DATA.maxD : to, day = effEnd.slice(8,10);
  const clampDay = ym => { const ld = lastDay(ym); return `${ym}-${day}` > ld ? ld : `${ym}-${day}`; };
  const pm = ymAdd(end,-1), py = ymAdd(end,-12);
  const lastCur = sumR(end+'-01', effEnd);
  const lastPm = sumR(pm+'-01', partial ? clampDay(pm) : lastDay(pm));
  const lastPy = py < firstM ? null : sumR(py+'-01', partial ? clampDay(py) : lastDay(py));
  const prevTotal = ymAdd(months[0],-12) < firstM ? null : sumR(shiftYear(from,-1), shiftYear(effEnd,-1));
  return {kind:'dash', months, cur, prev, custs, emps, total, prevTotal, n, docs, from, to, partial, effEnd, lastCur, lastPm, lastPy, pm, py,
    title:`Dashboard ยอดขาย (ย้อนหลัง ${n} เดือน)`,
    period:`เดือน ${ymLabel(months[0])} – ${ymLabel(end)}${cust.label?' · '+cust.label:''}`,
    note:'หมายเหตุ: ยอดขายสุทธิก่อน VAT (รวมใบลด/เพิ่มหนี้ ไม่รวมใบที่ยกเลิก)'};
}
function monthlyChart(v){
  const box = $('chMonthly'); const W = Math.max(300, box.clientWidth || 900), H = 230;
  const ml=56, mr=8, mt=10, mb=26, iw=W-ml-mr, ih=H-mt-mb, n=v.months.length;
  const vals = v.cur.concat(v.prev.filter(x=>x!==null));
  const mx = Math.max(...vals, 1), mn = Math.min(0, ...vals);
  const step = niceStep((mx-mn)/4), top = Math.ceil(mx/step)*step, bot = Math.floor(mn/step)*step;
  const y = val => mt + ih - (val-bot)/(top-bot)*ih, bw = iw/n, barW = Math.min(36, bw*0.62);
  let g = '';
  for (let t=bot; t<=top+1e-6; t+=step) g += `<line class="grid" x1="${ml}" x2="${W-mr}" y1="${y(t)}" y2="${y(t)}"/><text class="ax" x="${ml-6}" y="${y(t)+3}" text-anchor="end">${compactTH(t)}</text>`;
  const every = bw < 34 ? Math.ceil(34/bw) : 1;
  v.months.forEach((m,i)=>{
    const cx = ml + bw*i + bw/2, val = v.cur[i], y0 = y(0), y1 = y(val), h = Math.abs(y0-y1), r = Math.min(4, h, barW/2);
    if (h>0.5){
      // แท่งมุมโค้งเฉพาะปลายแท่ง ฐานตรง
      g += val>=0 ? `<path d="M${cx-barW/2},${y0} V${y1+r} Q${cx-barW/2},${y1} ${cx-barW/2+r},${y1} H${cx+barW/2-r} Q${cx+barW/2},${y1} ${cx+barW/2},${y1+r} V${y0} Z" fill="#2a78d6"/>`
                  : `<path d="M${cx-barW/2},${y0} V${y1-r} Q${cx-barW/2},${y1} ${cx-barW/2+r},${y1} H${cx+barW/2-r} Q${cx+barW/2},${y1} ${cx+barW/2},${y1-r} V${y0} Z" fill="#2a78d6"/>`;
    }
    if ((n-1-i)%every===0) g += `<text class="ax" x="${cx}" y="${H-8}" text-anchor="middle">${ymShort(m)}</text>`;
  });
  g += `<line x1="${ml}" x2="${W-mr}" y1="${y(0)}" y2="${y(0)}" stroke="#9aa5b4"/>`;
  // เส้นปีก่อน
  const pp = v.prev.map((p,i)=>p===null?null:[ml+bw*i+bw/2, y(p)]);
  let path='', on=false; pp.forEach(pt=>{ if(!pt){on=false;return;} path += (on?'L':'M')+pt[0]+','+pt[1]+' '; on=true; });
  if (path) g += `<path d="${path}" fill="none" stroke="#8a95a5" stroke-width="2" stroke-dasharray="5 3"/>` + pp.filter(Boolean).map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#fff" stroke="#8a95a5" stroke-width="2"/>`).join('');
  v.months.forEach((m,i)=>{ g += `<rect class="hit" data-i="${i}" x="${ml+bw*i}" y="${mt}" width="${bw}" height="${ih}"/>`; });
  box.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟยอดขายรายเดือน">${g}</svg>`;
  box.querySelectorAll('.hit').forEach(r=>{
    const i = +r.dataset.i, c = v.cur[i], p = v.prev[i];
    const html = `<b>${ymLabelF(v.months[i])}</b><br><span class="sw" style="background:#2a78d6"></span>ยอดขาย ${fmt0(c)}`
      + (p===null ? '' : `<br><span class="sw" style="background:#8a95a5"></span>ปีก่อน ${fmt0(p)}${p?` (${c>=p?'▲':'▼'} ${Math.abs((c-p)/Math.abs(p)*100).toFixed(1)}%)`:''}`);
    r.addEventListener('mousemove', e=>showTip(e,html)); r.addEventListener('mouseleave', hideTip);
    r.addEventListener('click', e=>showTip(e,html));
  });
}
function hbars(list, total, topN){
  const top = list.slice(0,topN), rest = list.slice(topN), other = r2(rest.reduce((s,r)=>s+r.net,0));
  const rows = top.map(r=>({name:r.name, key:r.key, net:r.net})); if (rest.length) rows.push({name:`อื่นๆ (${rest.length} ราย)`, net:other, other:true});

}

// ================= แอดมิน: อัปเดตข้อมูลจาก PREFLI02.CSV =================
function parseCSVLine(line){
  const out=[]; let cur='', q=false;
  for (let i=0;i<line.length;i++){
    const ch=line[i];
    if (q){ if (ch==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else { if (ch==='"') q=true; else if (ch===','){ out.push(cur); cur=''; } else cur+=ch; }
  }
  out.push(cur); return out;
}
function decode(buf){
  const u8 = new Uint8Array(buf);
  try { const t = new TextDecoder('utf-8',{fatal:true}).decode(u8); if (/[฀-๿]/.test(t)) return t; } catch(e){}
  return new TextDecoder('windows-874').decode(u8);
}
function parseUpload(text){
  const nl = text.indexOf('\n');
  const head = parseCSVLine(text.slice(0,nl).replace(/\r$/,'')).map(h=>h.trim().toLowerCase());
  let res;
  if (head.includes('gcoor') && head.includes('prodamt')) res = parsePCRSX1(text, head);
  else if (head.includes('sdamtbfvat') && head.includes('coor')) res = parsePREFLI(text, head);
  else throw new Error('ใช้ได้กับไฟล์ PCRSX1.CSV (ใบส่งของแยกตามลูกค้า) หรือ PREFLI02.CSV เท่านั้น');
  if (!res.docs.length) throw new Error('ไม่พบเอกสารขายในไฟล์');
  const ds = res.docs.map(d=>d[0]).sort();
  res.headerRange = !!(res.from && res.to);
  if (!res.from) res.from = ds[0];
  if (!res.to) res.to = ds[ds.length-1];
  return res;
}
function readHeadMsg(msg, res){
  msg = msg.replace(/\s+/g,' ').trim();
  if (/บริษัท/.test(msg) && !res.company) res.company = msg;
  const dm = msg.match(/ตั้งแต่(?:วันที่)?\s*(\d{1,2}\/\d{1,2}\/\d{2,4})\s*ถึง\s*(\d{1,2}\/\d{1,2}\/\d{2,4})/);
  if (dm){ res.from = beToISO(dm[1]); res.to = beToISO(dm[2]); }
}
// ชื่อพนักงานขาย (PCRSX1 มีแต่รหัส) — ใช้ชื่อจากฐานข้อมูลก่อน ถ้าไม่มีใช้ตารางนี้
const EMP_NAMES = {'Z01-JASON':'คุณเจสัน หมอนทอง','00-VPACK':'V-PACK','02-ANAN':'คุณอนันต์ ผลกังวาน','04-VANICH':'คุณวานิช ผลกังวาน',
                   '08-ANEK':'คุณเอนก ผลกังวาน','07-JUTIMA':'คุณจุติมา ตระกูลยิ่งเจริญ','Z03-SAHAPA':'คุณสหพันธ์ ผลกังวาน'};
// PCRSX1 : รายงานใบส่งของแยกตามลูกค้า (มีใบลด/เพิ่มหนี้ด้วย)
function parsePCRSX1(text, head){
  const ix = k => head.indexOf(k);
  const I = {date:ix('date'),ref:ix('refno'),emp:ix('salesman'),amt:ix('prodamt'),vat:ix('vatamt'),tot:ix('netamt'),due:ix('duedate')};
  const res = {kind:'PCRSX1 (ใบส่งของแยกตามลูกค้า)', company:'', from:null, to:null, docs:[], cancelled:0};
  const empDB = {}; (DATA?DATA.docs:[]).forEach(d=>{ if (d.empn && d.empn!==d.emp) empDB[d.emp]=d.empn; });
  const reDate = /^(\d{2})\/(\d{2})\/(\d{4})$/;
  let cCode='', cName='';
  text.split(/\r?\n/).slice(1).forEach(l=>{
    if (!l) return;
    const c = parseCSVLine(l), lv = c[c.length-2], msg = c[c.length-1] || '';
    if (lv==='0'){
      if (!msg.trim() || /^[\s\-=]/.test(msg) || msg.includes('รหัสสินค้า') || msg.includes('ลำดับ')) return;
      if (!res.docs.length && !cCode && (/บริษัท/.test(msg) || /ตั้งแต่/.test(msg))){ readHeadMsg(msg,res); return; }
      if (/^(ลูกค้า|แผนก|วันที่|รายงาน)/.test(msg)) return;
      const m = msg.match(/^(\S+)\s+(.+)$/);              // บรรทัดหัวลูกค้า: "รหัส ชื่อลูกค้า"
      if (m){ cCode = m[1]; cName = m[2].replace(/\s+/g,' ').trim(); }
      return;
    }
    if (lv!=='1') return;
    const dm = (c[I.date]||'').match(reDate); if (!dm) return;
    const amt = parseFloat(c[I.amt])||0, vat = parseFloat(c[I.vat])||0, tot = parseFloat(c[I.tot])||0;
    if (!amt && !vat && !tot) return;                        // เอกสารยอด 0 ข้าม
    const du = (c[I.due]||'').match(reDate), emp = (c[I.emp]||'').trim();
    res.docs.push([`${dm[3]}-${dm[2]}-${dm[1]}`, (c[I.ref]||'').trim(), cCode, cName, emp, empDB[emp] || EMP_NAMES[emp] || emp,
                   amt, vat, tot, du ? `${du[3]}-${du[2]}-${du[1]}` : '', '']);
  });
  return res;
}
function parsePREFLI(text, head){
  const ix = k => head.indexOf(k);
  const I = {date:ix('date'),no:ix('no'),stat:ix('stat'),coor:ix('coor'),name:ix('name'),emp:ix('qcempl'),empn:ix('qnempl'),
             amt:ix('sdamtbfvat'),vat:ix('stdvat'),tot:ix('stdtotamt'),due:ix('duedate'),refno:ix('refno'),refto:ix('refto'),lv:ix('subhdlevel')};
  const res = {kind:'PREFLI02 (ใบส่งของขายเชื่อ)', company:'', from:null, to:null, docs:[], cancelled:0};
  const lines = text.split(/\r?\n/), reDate = /^(\d{2})\/(\d{2})\/(\d{4}),/;
  for (let i=1;i<lines.length;i++){
    const l = lines[i]; if (!l) continue;
    if (!reDate.test(l)){
      if (!res.docs.length && (l.includes('บริษัท') || l.includes('ตั้งแต่'))){
        const c=parseCSVLine(l), msg=(c[c.length-1]||'').replace(/\s+/g,' ').trim();
        if (/บริษัท/.test(msg) && !res.company) res.company = msg;
        const dm = msg.match(/ตั้งแต่(?:วันที่)?\s*([\d\/]+)\s*ถึง\s*([\d\/]+)/);
        if (dm){ res.from = beToISO(dm[1]); res.to = beToISO(dm[2]); }
      }
      continue;
    }
    const c = parseCSVLine(l);
    if (c[I.lv] !== '1') continue;
    if ((c[I.stat]||'').trim()==='C'){ res.cancelled++; continue; }
    const dm = c[I.date].match(/(\d{2})\/(\d{2})\/(\d{4})/), du = (c[I.due]||'').match(/(\d{2})\/(\d{2})\/(\d{4})/);
    res.docs.push([`${dm[3]}-${dm[2]}-${dm[1]}`, (c[I.refno]||'').trim() || c[I.no].trim(), c[I.coor].trim(), c[I.name].trim(), c[I.emp].trim(),
      c[I.empn].replace(/\s+/g,' ').trim(), parseFloat(c[I.amt])||0, parseFloat(c[I.vat])||0, parseFloat(c[I.tot])||0,
      du ? `${du[3]}-${du[2]}-${du[1]}` : '', (c[I.refto]||'').trim()]);
  }
  return res;
}
$('file').onchange = e => {
  const f = e.target.files[0]; $('file').value=''; if (!f) return;

    catch(err){ alert('อ่านไฟล์ไม่ได้: ' + err.message); }
  };
  rd.readAsArrayBuffer(f);
};

      <tr><th></th><th>จำนวนบิล</th><th>ยอดก่อน VAT</th></tr>
      <tr><td>ข้อมูลเดิมในช่วงนี้ (จะถูกแทนที่)</td><td class="n">${old.length.toLocaleString()}</td><td class="n">${fmt0(oldSum)}</td></tr>
      <tr><td><b>ข้อมูลใหม่จากไฟล์</b></td><td class="n"><b>${P.docs.length.toLocaleString()}</b></td><td class="n"><b>${fmt0(newSum)}</b></td></tr>
    </table>
    <div class="info">${P.cancelled?`ไม่นับใบที่ยกเลิก ${P.cancelled} ใบ · `:''}มีใบลด/เพิ่มหนี้ ${P.docs.filter(d=>!isSale(d[1])).length} ใบ · ข้อมูลนอกช่วงวันที่นี้จะไม่ถูกแตะต้อง</div>
    ${warn}
    <div class="act"><button class="btn line" onclick="closeModal()">ยกเลิก</button><button class="btn green" id="btnConfirm" onclick="doUpload()">ยืนยันอัปเดต</button></div>`;
  $('modalBg').classList.remove('hidden');

function closeModal(){ $('modalBg').classList.add('hidden'); PENDING=null; }
async function doUpload(){

// ---------- ช่องวันที่: พิมพ์แค่ตัวเลข เช่น 01102569 → 01/10/2569 (input mask) ----------
function validBE(v){
  const iso = beToISO(v); if (!iso || !/^\d{2}\/\d{2}\/\d{4}$/.test(v)) return false;
  const [y,m,d] = iso.split('-').map(Number), dt = new Date(y,m-1,d);
  return dt.getFullYear()===y && dt.getMonth()===m-1 && dt.getDate()===d;
}
function maskDate(el){
  const dig = el.value.replace(/\D/g,'').slice(0,8);
  let out = dig.slice(0,2);
  if (dig.length>2) out += '/' + dig.slice(2,4);
  if (dig.length>4) out += '/' + dig.slice(4);
  el.value = out;
  el.classList.remove('bad');
  if (dig.length===8){ if (validBE(out)) render(); else el.classList.add('bad'); }
}
function finishDate(el){
  const dig = el.value.replace(/\D/g,'');
  if (dig.length===6) el.value = `${dig.slice(0,2)}/${dig.slice(2,4)}/25${dig.slice(4)}`;   // 011069 → 01/10/2569
  if (!el.value) return;
  if (validBE(el.value)){ el.classList.remove('bad'); render(); } else el.classList.add('bad');
}
['d1','d2'].forEach(id=>{
  const el = $(id);
  el.addEventListener('input', ()=>maskDate(el));
  el.addEventListener('blur', ()=>finishDate(el));
  el.addEventListener('keydown', e=>{ if (e.key==='Enter'){ finishDate(el); if (id==='d1') $('d2').focus(); } });
  el.addEventListener('focus', ()=>el.select());
});

// ---------- ตั้งค่าการพิมพ์ (ฟอนต์ / ขนาด / กระดาษ) ----------
const PRINT_KEY = 'vpack_sales_print';
const FONT_CSS = {
  'Tahoma':"Tahoma, sans-serif", 'Sarabun':"'Sarabun', Tahoma, sans-serif",
  'TH Sarabun New':"'TH Sarabun New','TH SarabunPSK', Tahoma, sans-serif",
  'Angsana New':"'Angsana New','AngsanaUPC', serif", 'Cordia New':"'Cordia New','CordiaUPC', sans-serif",
  'Browallia New':"'Browallia New','BrowalliaUPC', sans-serif",
  'Leelawadee UI':"'Leelawadee UI','Leelawadee', Tahoma, sans-serif", 'Arial':"Arial, sans-serif"
};
const SMALL_FONTS = ['TH Sarabun New','Angsana New','Cordia New','Browallia New'];   // ฟอนต์ที่ตัวเล็กกว่าปกติ
function loadPrintSettings(){
  let st = {font:'Tahoma', size:'10', page:'A4 landscape'};
  try { Object.assign(st, JSON.parse(lsGet(PRINT_KEY)||'{}')); } catch(e){}
  $('pFont').value = st.font; $('pSize').value = st.size; $('pPage').value = st.page;
  applyPrint(true);
}
function onFont(){
  const f = $('pFont').value, sz = +$('pSize').value;
  if (SMALL_FONTS.includes(f) && sz < 14) $('pSize').value = '14';
  if (!SMALL_FONTS.includes(f) && sz > 12) $('pSize').value = '10';
  applyPrint();
}
function applyPrint(silent){
  const f = $('pFont').value, sz = $('pSize').value, pg = $('pPage').value;
  const paper = $('report');
  paper.style.setProperty('--pf', FONT_CSS[f] || f);
  paper.style.setProperty('--ps', sz + 'pt');
  $('pageStyle').textContent = `@page{size:${pg};margin:10mm}`;
  if (f==='Sarabun' && !$('gfSarabun')){
    const l = document.createElement('link'); l.id='gfSarabun'; l.rel='stylesheet';
    l.href='https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap'; document.head.appendChild(l);
  }
  $('pHint').textContent = SMALL_FONTS.includes(f) ? 'ฟอนต์นี้ต้องมีในเครื่อง และตัวเล็กกว่าปกติ แนะนำ 14–16 pt'
                         : f==='Sarabun' ? 'โหลดจากอินเทอร์เน็ต' : '';
  if (!silent) lsSet(PRINT_KEY, JSON.stringify({font:f, size:sz, page:pg}));
}
function togglePrint(show){
  const bar = $('printbar');
  const on = show===undefined ? bar.classList.contains('hidden') : show;
  bar.classList.toggle('hidden', !on);
  $('report').classList.toggle('pp', on);     // ดูตัวอย่างบนจอ
}
window.addEventListener('beforeprint', ()=>$('report').classList.add('pp'));
window.addEventListener('afterprint', ()=>{ if ($('printbar').classList.contains('hidden')) $('report').classList.remove('pp'); });
loadPrintSettings();

// ---------- start ----------
const saved = lsGet(PIN_KEY);
if (saved) login(saved); else setTimeout(()=>$('pin').focus(), 50);
</script>
